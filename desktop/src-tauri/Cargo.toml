[package]
name = "desktop"
version = "0.3.12"
description = "OpenWorktree 桌面壳：托管 OpenWorktree 后端单文件并提供原生窗口"
authors = ["Saktawdi"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 裸构建（--no-bundle）的入口名即此；NSIS 打包时仍按 tauri.conf 的 productName
# 安装为 OpenWorktree.exe。与包名解耦，避免任务管理器里出现 desktop.exe。
[[bin]]
name = "openworktree"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：程序化托盘（图标 + 动态菜单）；image-png：include_bytes 的 PNG 图标解码
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
# 托盘轮询后端 HTTP API 用（仅 http://127.0.0.1，不要 TLS）
ureq = { version = "2", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
