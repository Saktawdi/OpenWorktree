<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>OpenWorktree Tray</title>
  <style>
    /* 细长菜单风：紧凑行高、去页头大按钮；亮/暗双主题跟随 SPA（快照 theme 字段）。 */
    :root {
      --radius: 10px;
      --row-h: 32px;
      --font: "Geist", "Segoe UI", system-ui, sans-serif;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: rgba(18, 23, 31, .97);
      --hover: #1d2632;
      --active: #243040;
      --edge: #2a3441;
      --ink: #dfe7ee;
      --dim: #93a1af;
      --faint: #6b7887;
      --green: #3fb950;
      --orange: #f0883e;
      --shadow: 0 10px 32px rgba(0, 0, 0, .5);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: rgba(252, 252, 253, .97);
      --hover: #eef1f5;
      --active: #e4e9ef;
      --edge: #e3e7ec;
      --ink: #1f2730;
      --dim: #5b6672;
      --faint: #98a2ad;
      --green: #1a7f37;
      --orange: #bc4c00;
      --shadow: 0 10px 32px rgba(30, 40, 55, .22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; cursor: default; }
    html, body { height: 100%; background: transparent; overflow: hidden;
      font-family: var(--font); font-size: 12.5px; color: var(--ink); }
    .panel { height: 100%; display: flex; flex-direction: column; background: var(--bg);
      border: 1px solid var(--edge); border-radius: var(--radius); box-shadow: var(--shadow);
      overflow: hidden; backdrop-filter: blur(10px); }

    /* 页头一行：徽标 + 名称 + 状态，压缩到 24px 高 */
    header { display: flex; align-items: center; gap: 7px; padding: 9px 12px 7px; }
    header img { width: 14px; height: 14px; }
    header .name { font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--dim); }
    header .chip { margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--faint); }
    .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
    .chip.running .dot { background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
    .chip.running { color: var(--green); }
    .chip.offline .dot { background: var(--orange); }
    .chip.offline { color: var(--orange); }
    @keyframes pulse { 50% { opacity: .35; } }

    .divider { height: 1px; background: var(--edge); margin: 0 10px; }

    .list { flex: 1; overflow-y: auto; padding: 5px 6px; }
    .list::-webkit-scrollbar { width: 6px; }
    .list::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 3px; }
    /* 项目行 = 菜单条目：圆点 + 名称，细长（32px），左侧绿点承载选中态 */
    .proj { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
      background: transparent; border: 0; border-radius: 7px; padding: 0 10px; height: var(--row-h);
      color: var(--ink); font: inherit; cursor: pointer; }
    .proj:hover { background: var(--hover); }
    .proj:active { background: var(--active); }
    .proj .dot { width: 7px; height: 7px; border-radius: 50%; flex: none;
      background: var(--green); box-shadow: 0 0 5px rgba(63, 185, 80, .45); }
    .proj .dot.off { background: transparent; border: 1.5px solid var(--faint); box-shadow: none; opacity: .55; }
    .proj .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .proj.selected .name { font-weight: 600; }
    .empty { padding: 14px 10px; text-align: center; color: var(--faint); font-size: 12px; }

    /* 底部操作 = 两根细菜单行（不再是按钮组），与项目行同高同风格 */
    footer { padding: 5px 6px 6px; border-top: 1px solid var(--edge); }
    .act { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
      background: transparent; border: 0; border-radius: 7px; padding: 0 10px; height: var(--row-h);
      color: var(--dim); font: inherit; cursor: pointer; }
    .act:hover { background: var(--hover); color: var(--ink); }
    .act svg { flex: none; }
    .act.danger:hover { color: #e5534b; }
    :root[data-theme="dark"] .act.danger:hover { color: #f85149; }
  </style>
</head>
<body>
  <div class="panel">
    <header>
      <img id="badge" src="assets/ow-light-badge-64.png" alt="" />
      <span class="name">OpenWorktree</span>
      <span class="chip" id="chip"><span class="dot"></span><span id="chipText">…</span></span>
    </header>
    <div class="divider"></div>
    <div class="list" id="projects"><div class="empty">加载中…</div></div>
    <div class="divider"></div>
    <footer>
      <button id="btnMain" class="act">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="2" y="2" width="12" height="12" rx="2.5"/><path d="M2 6h12"/>
        </svg>
        打开工作台
      </button>
      <button id="btnQuit" class="act danger">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>
        </svg>
        退出 OpenWorktree
      </button>
    </footer>
  </div>

  <script>
    // ?mock=1：脱离 Tauri 在浏览器里调样式用（固定假数据，命令空转）
    const MOCK = new URLSearchParams(location.search).has("mock");
    const T = window.__TAURI__;
    const invoke = (cmd, args) =>
      MOCK ? Promise.resolve(null) : T.core.invoke(cmd, args);

    const STATUS_TEXT = {
      starting: "启动中",
      idle: "空闲",
      running: "{n} 运行中",
      offline: "未就绪",
    };
    // 徽标随主题换（亮底用深色徽标，暗底用亮色徽标）
    const BADGE = { dark: "assets/ow-light-badge-64.png", light: "assets/ow-dark-badge-64.png" };

    function render(s) {
      const root = document.documentElement;
      const theme = s.theme === "light" ? "light" : "dark";
      root.dataset.theme = theme;
      document.getElementById("badge").src = BADGE[theme];

      const chip = document.getElementById("chip");
      const chipText = document.getElementById("chipText");
      chip.classList.remove("running", "offline");
      if (s.status === "running") {
        chip.classList.add("running");
        chipText.textContent = STATUS_TEXT.running.replace("{n}", s.busy ?? 0);
      } else if (s.status === "offline") {
        chip.classList.add("offline");
        chipText.textContent = STATUS_TEXT.offline;
      } else if (s.status === "starting") {
        chipText.textContent = STATUS_TEXT.starting;
      } else {
        chipText.textContent = STATUS_TEXT.idle;
      }

      const list = document.getElementById("projects");
      const projects = s.projects ?? [];
      if (!projects.length) {
        list.innerHTML =
          '<div class="empty">' +
          (s.status === "starting" ? "正在启动本地服务…" : "暂无接入项目") +
          "</div>";
        return;
      }
      list.innerHTML = projects
        .map(function (p) {
          return (
            '<button class="proj' + (p.selected ? " selected" : "") + '" data-id="' +
            encodeURIComponent(p.id) + '">' +
            '<span class="dot' + (p.selected ? "" : " off") + '"></span>' +
            '<span class="name"></span></button>'
          );
        })
        .join("");
      // 项目名走 textContent 注入，避免 workspace 名里的字符被当 HTML 解析
      var rows = list.querySelectorAll(".proj");
      projects.forEach(function (p, i) {
        rows[i].querySelector(".name").textContent = p.name;
        rows[i].onclick = function () {
          invoke("tray_open_project", { projectId: p.id });
        };
      });
    }

    document.getElementById("btnMain").onclick = function () {
      invoke("tray_open_main");
    };
    document.getElementById("btnQuit").onclick = function () {
      invoke("tray_quit");
    };
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") invoke("tray_close_panel");
    });

    if (MOCK) {
      const params = new URLSearchParams(location.search);
      render({
        status: params.get("status") ?? "running",
        busy: Number(params.get("busy") ?? 2),
        theme: params.get("theme") ?? "dark",
        selected: "p1",
        projects: [
          { id: "p1", name: "BLOG", selected: true },
          { id: "p2", name: "ai-generate", selected: false },
          { id: "p3", name: "超长项目名称测试超长项目名称测试超长项目名称", selected: false },
        ],
      });
    } else {
      // 首帧：直接要一份数据；后续由轮询线程变化时推 tray-snapshot
      invoke("get_tray_state").then(render).catch(function () {});
      T.event.listen("tray-snapshot", function (e) {
        render(e.payload);
      });
    }
  </script>
</body>
</html>
