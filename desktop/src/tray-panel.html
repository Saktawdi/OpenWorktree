<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>OpenWorktree Tray</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f141b;
      --bg-raised: #161d26;
      --edge: #262f3a;
      --edge-strong: #303b47;
      --ink: #e6edf3;
      --dim: #9aa7b4;
      --faint: #66727e;
      --accent: #7c5cff;
      --green: #3fb950;
      --orange: #f0883e;
      --red: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; cursor: default; }
    html, body { height: 100%; background: transparent; overflow: hidden;
      font-family: "Geist", "Segoe UI", system-ui, sans-serif; font-size: 13px; color: var(--ink); }
    .panel { height: 100%; display: flex; flex-direction: column; background: var(--bg);
      border: 1px solid var(--edge); border-radius: 12px; overflow: hidden; }

    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; }
    header img { width: 18px; height: 18px; }
    header .name { font-size: 13.5px; font-weight: 600; letter-spacing: .02em; }
    header .chip { margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--dim); background: var(--bg-raised);
      border: 1px solid var(--edge); border-radius: 999px; padding: 3px 9px; }
    .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
    .chip.running .dot { background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
    .chip.running { color: var(--green); }
    .chip.offline .dot { background: var(--orange); }
    .chip.offline { color: var(--orange); }
    @keyframes pulse { 50% { opacity: .35; } }

    .divider { height: 1px; background: var(--edge); margin: 0 14px; }

    .section { padding: 10px 14px 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em;
      color: var(--faint); }

    .list { flex: 1; overflow-y: auto; padding: 2px 8px 8px; }
    .list::-webkit-scrollbar { width: 6px; }
    .list::-webkit-scrollbar-thumb { background: var(--edge-strong); border-radius: 3px; }
    .proj { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      background: transparent; border: 0; border-radius: 8px; padding: 9px 10px;
      color: var(--ink); font: inherit; cursor: pointer; }
    .proj:hover { background: var(--bg-raised); }
    .proj:active { background: #1c242e; }
    .proj .dot { width: 8px; height: 8px; border-radius: 50%; flex: none;
      background: var(--green); box-shadow: 0 0 6px rgba(63, 185, 80, .55); }
    .proj .dot.off { background: transparent; border: 1.5px solid var(--edge-strong); box-shadow: none; }
    .proj .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .proj .arrow { color: var(--faint); font-size: 12px; opacity: 0; transition: opacity .12s; }
    .proj:hover .arrow { opacity: 1; }
    .proj.selected .name { font-weight: 600; }
    .empty { padding: 18px 10px; text-align: center; color: var(--faint); font-size: 12px; }

    footer { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--edge); }
    footer button { flex: 1; padding: 7px 0; border-radius: 8px; font: inherit; font-size: 12.5px;
      cursor: pointer; background: var(--bg-raised); color: var(--dim);
      border: 1px solid var(--edge); transition: background .12s, color .12s; }
    footer button:hover { background: #1e2630; color: var(--ink); border-color: var(--edge-strong); }
    footer button.primary { color: var(--ink); border-color: var(--edge-strong); }
    footer button.primary:hover { border-color: var(--accent); color: #cabdff; }
    footer button.danger:hover { color: var(--red); border-color: rgba(248, 81, 73, .45); }
  </style>
</head>
<body>
  <div class="panel">
    <header>
      <img src="assets/ow-light-badge-64.png" alt="" />
      <span class="name">OpenWorktree</span>
      <span class="chip" id="chip"><span class="dot"></span><span id="chipText">…</span></span>
    </header>
    <div class="divider"></div>
    <div class="section">接入项目</div>
    <div class="list" id="projects"><div class="empty">加载中…</div></div>
    <footer>
      <button id="btnMain" class="primary">打开工作台</button>
      <button id="btnQuit" class="danger">退出</button>
    </footer>
  </div>

  <script>
    // ?mock=1：脱离 Tauri 在浏览器里调样式用（固定假数据，命令空转）
    const MOCK = new URLSearchParams(location.search).has("mock");
    const T = window.__TAURI__;
    const invoke = (cmd, args) =>
      MOCK ? Promise.resolve(null) : T.core.invoke(cmd, args);

    const STATUS_TEXT = {
      starting: "启动中",
      idle: "智能体空闲",
      running: "Agent 运行中 × {n}",
      offline: "后端未就绪",
    };

    function render(s) {
      const chip = document.getElementById("chip");
      const chipText = document.getElementById("chipText");
      chip.classList.remove("running", "offline");
      if (s.status === "running") {
        chip.classList.add("running");
        chipText.textContent = STATUS_TEXT.running.replace("{n}", s.busy ?? 0);
      } else if (s.status === "offline") {
        chip.classList.add("offline");
        chipText.textContent = STATUS_TEXT.offline;
      } else if (s.status === "starting") {
        chipText.textContent = STATUS_TEXT.starting;
      } else {
        chipText.textContent = STATUS_TEXT.idle;
      }

      const list = document.getElementById("projects");
      const projects = s.projects ?? [];
      if (!projects.length) {
        list.innerHTML =
          '<div class="empty">' +
          (s.status === "starting" ? "正在启动本地服务…" : "暂无接入项目") +
          "</div>";
        return;
      }
      list.innerHTML = projects
        .map(function (p) {
          return (
            '<button class="proj' + (p.selected ? " selected" : "") + '" data-id="' +
            encodeURIComponent(p.id) + '">' +
            '<span class="dot' + (p.selected ? "" : " off") + '"></span>' +
            '<span class="name"></span><span class="arrow">→</span></button>'
          );
        })
        .join("");
      // 项目名走 textContent 注入，避免 workspace 名里的字符被当 HTML 解析
      var rows = list.querySelectorAll(".proj");
      projects.forEach(function (p, i) {
        rows[i].querySelector(".name").textContent = p.name;
        rows[i].onclick = function () {
          invoke("tray_open_project", { projectId: p.id });
        };
      });
    }

    document.getElementById("btnMain").onclick = function () {
      invoke("tray_open_main");
    };
    document.getElementById("btnQuit").onclick = function () {
      invoke("tray_quit");
    };
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") invoke("tray_close_panel");
    });

    if (MOCK) {
      render({
        status: "running",
        busy: 2,
        selected: "p1",
        projects: [
          { id: "p1", name: "BLOG", selected: true },
          { id: "p2", name: "ai-generate", selected: false },
          { id: "p3", name: "超长项目名称测试超长项目名称测试超长项目名称", selected: false },
        ],
      });
    } else {
      // 首帧：直接要一份数据；后续由轮询线程变化时推 tray-snapshot
      invoke("get_tray_state").then(render).catch(function () {});
      T.event.listen("tray-snapshot", function (e) {
        render(e.payload);
      });
    }
  </script>
</body>
</html>
