<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>OpenWorktree</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; height: 100vh; overflow: hidden;
        font-family: "Geist", "Segoe UI", system-ui, sans-serif;
        background: #0d1117; color: #e6edf3;
      }
      body.light { background: #ffffff; color: #1f2328; }
      #ow-spa { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
      #splash { position: fixed; inset: 0; z-index: 5;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
      .badge { width: 72px; height: 72px; }
      .title { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
      .status { font-size: 13px; opacity: 0.7; }
      .spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 3px solid rgba(127,127,127,0.25); border-top-color: #7c5cff;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error { display: none; max-width: 480px; text-align: center;
        padding: 12px 16px; border-radius: 10px;
        background: rgba(207,34,46,0.12); border: 1px solid rgba(207,34,46,0.4);
        color: #f85149; font-size: 13px; white-space: pre-wrap; }
      .winbtn { width: 28px; height: 28px; border: none; border-radius: 6px; background: transparent;
        color: inherit; font-size: 13px; cursor: pointer; display: none;
        align-items: center; justify-content: center; }
      .winbtn:hover { background: rgba(127,127,127,0.15); }
      .winbtn.close:hover { background: rgba(207,34,46,0.18); color: #f85149; }
    </style>
  </head>
  <body>
    <!-- 无边框窗口：SPA 经 iframe 承载（保持远端同源，WS/SSE 不受影响）；
         窗口操作（拖拽/最小化/最大化/关闭）由本页（tauri:// 域）经 postMessage 桥执行。 -->
    <!-- 启动页阶段的拖拽条：只服务 splash 期（SPA 顶栏有自己的 postMessage 拖拽桥）。
         SPA 加载完成后必须隐藏，否则这条 36px、z-index:10 的遮罩会挡死 iframe 顶栏的所有按钮。 -->
    <div id="splash-drag" data-tauri-drag-region style="position:fixed; inset:0 0 auto 0; height:36px; z-index:10"></div>
    <button id="splash-close" class="winbtn close" title="关闭" style="position:fixed; top:4px; right:10px; z-index:11">✕</button>
    <iframe id="ow-spa" title="OpenWorktree"></iframe>
    <div id="splash">
      <img class="badge" id="splash-badge" src="assets/ow-light-badge-64.png" alt="OpenWorktree" />
      <div class="title">OpenWorktree</div>
      <div class="spinner"></div>
      <div class="status">正在启动本地服务…</div>
      <div class="error" id="err"></div>
    </div>
    <script>
      // 跟随 SPA 主题偏好，仅影响启动页观感。
      try {
        if (localStorage.getItem("ow-theme") === "light") {
          document.body.classList.add("light");
          document.getElementById("splash-badge").src = "assets/ow-dark-badge-64.png";
        }
      } catch (_) {}

      const splash = document.getElementById("splash");
      const splashClose = document.getElementById("splash-close");
      const iframe = document.getElementById("ow-spa");
      const tauriWindow = () => window.__TAURI__?.window?.getCurrentWindow?.();

      // 启动页右上角关闭（tauri:// 域直接可用）
      if (tauriWindow()) {
        splashClose.style.display = "flex";
        splashClose.onclick = () => void tauriWindow().close();
      }

      // backend-ready：壳 Rust 侧从后端 stdout/stderr 抓到令牌后发出（src-tauri/lib.rs）
      window.__TAURI__.event.listen("backend-ready", (e) => {
        iframe.src = `http://127.0.0.1:${e.payload.port}/?ow-token=${e.payload.token}`;
        iframe.addEventListener("load", () => {
          // #ow-spa 初始 display:none，承载 SPA 后必须显式放开，否则只剩壳的背景色；
          // 同时撤掉启动期的拖拽条与悬浮关闭钮，把顶栏（含 SPA 自己的窗口按钮）完整还给 SPA
          document.getElementById("splash-drag").style.display = "none";
          splashClose.style.display = "none";
          iframe.style.display = "block";
          splash.style.display = "none";
        }, { once: true });
      });

      window.__TAURI__.event.listen("backend-error", (e) => {
        document.querySelector(".spinner").style.display = "none";
        document.querySelector(".status").textContent = "启动失败";
        const err = document.getElementById("err");
        err.textContent = typeof e.payload === "string" ? e.payload : String(e.payload);
        err.style.display = "block";
      });

      // —— 托盘桥：三段链路 ——
      // ① Rust 轮询后端 → 菜单显示运行数/项目列表（Rust 侧独立完成，不经过本页）；
      // ② 托盘点项目 → Rust emit tray-open-project → 本页转发给 iframe SPA 切工作台；
      // ③ SPA 切项目 → postMessage 给本页 → 本页 emit tray-selected-project → Rust 记录画绿点。
      window.__TAURI__.event.listen("tray-open-project", (e) => {
        iframe.contentWindow?.postMessage({ __ow: true, action: "open-project", projectId: e.payload }, "*");
      });

      // —— postMessage 桥：SPA（远端 origin）→ 本页执行窗口操作 ——
      window.addEventListener("message", async (e) => {
        const d = e.data || {};
        if (!d.__ow) return;
        const w = tauriWindow();
        if (!w) return;
        switch (d.action) {
          case "minimize": void w.minimize(); break;
          case "toggle-maximize": void w.toggleMaximize(); break;
          case "close": void w.close(); break;
          // SPA 侧 activeProjectId / 主题变化（含切换/清空）→ 通知 Rust 托盘（绿点/换肤）。
          // emit 需经 Tauri API（本页 tauri:// 域可用），SPA 自身拿不到。
          case "tray-selected-project":
            void window.__TAURI__.event.emit("tray-selected-project", d.projectId ?? "");
            break;
          case "tray-theme":
            void window.__TAURI__.event.emit("tray-theme", d.theme ?? "dark");
            break;
          // startDragging 需在鼠标按住期间发起；iframe mousedown → postMessage 的延迟
          // 在一帧内，可正常拖动。若个别环境失效，退路是回到系统标题栏。
          case "start-drag": void w.startDragging(); break;
          case "query-maximized":
            if (e.source) {
              const m = await w.isMaximized();
              e.source.postMessage({ __ow: true, action: "maximized", value: m }, "*");
            }
            break;
        }
      });

      // 窗口尺寸变化（含最大化/还原）推送给 SPA，同步最大化图标
      if (tauriWindow()) {
        tauriWindow().onResized(async () => {
          const m = await tauriWindow().isMaximized();
          iframe.contentWindow?.postMessage({ __ow: true, action: "maximized", value: m }, "*");
        });
      }
    </script>
  </body>
</html>
