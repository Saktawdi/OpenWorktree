# gate-web 运行时 SLF4J(slf4j-simple) 配置：功能出入口事件在 info 级别可见，
# 框架内部噪声（jetty/flyway）压到 warn。访问日志已移除——见 WebServer/TaskRunner。
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.eclipse.jetty=warn
org.slf4j.simpleLogger.log.org.flywaydb=warn
org.slf4j.simpleLogger.showShortLogName=true
