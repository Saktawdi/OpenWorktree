# OpenWorktree 原生二进制构建（方案2：GraalVM native-image 单文件分发）。
#
# 触发：push 到 master 且涉及后端/工作流文件（前端-only 改动不重编 native）。
# 产物：双平台单文件二进制，作为 build artifact 保留 14 天；打 tag 时同时附到 Release。
#
# agent-config 目录是 tracing agent 采集的 reachability 元数据（reflect/jni/resource/proxy），
# 提交在仓库里；新增依赖引入运行时反射错误时的修复流程：
#   1. 本地 Docker 里跑 tracing agent 重新采集（本地 Docker GraalVM 镜像跑一遍 JVM 模式 + curl 触达 API）；
#   2. 把生成的配置合并回本目录（按 jar 前缀人工归并）；
#   3. 重跑本工作流验证。
name: native-build

on:
  push:
    branches: [master, main]
    paths:
      - 'pom.xml'
      - 'gate-domain/**'
      - 'gate-ports/**'
      - 'gate-application/**'
      - 'gate-adapters/**'
      - 'gate-bootstrap/**'
      - 'gate-cli/**'
      - 'gate-web/**'
      - 'gate-web-ui/src/**'
      - 'gate-web-ui/package.json'
      - 'desktop/**'
      - '.github/native-image/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    name: native-image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      # 前端产物。gate-web-ui/dist 在 .gitignore 里，CI 必须自己构建；
      # 前端源码改动同样触发本工作流，保证 dist 总是与后端 HEAD 配套。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # plugin-sdk 以 file: 软链进 gate-web-ui，软链不递归安装自身依赖；
      # 其 types.ts import react 类型，须先在包内装好 devDependencies（react/@types/react）。
      - name: Install plugin-sdk deps
        working-directory: packages/plugin-sdk
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Build SPA
        working-directory: gate-web-ui
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run build

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm-community'
          native-image-job-reports: 'true'

      - name: Maven install (skip tests; unit tests run on JVM in a separate job)
        run: mvn -B -q -DskipTests install

      # runtime-scope 依赖 jar：测试家族（junit/archunit）不进 native 类路径
      - name: Copy runtime dependencies
        run: mvn -B -q -pl gate-web dependency:copy-dependencies -DincludeScope=runtime

      # Flyway 在 native image 下无法扫描 classpath 资源（unsupported protocol: resource），
      # 运行时走 NativeMigrations 的 manifest+filesystem 路径 —— manifest 必须在构建期生成。
      - name: Generate migration manifest
        shell: bash
        run: |
          cd gate-adapters/target/classes/db/migration
          ls -1 V*.sql | sort > manifest.txt

      # WebServer.ROOT=/static：classpath 根下必须有 static/ 子目录才能命中 SPA 资源
      - name: Stage SPA under /static
        shell: bash
        run: |
          mkdir -p ui-root/static
          cp -r gate-web-ui/dist/. ui-root/static/

      - name: Native image compile (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          CP="gate-domain/target/classes:gate-ports/target/classes:gate-application/target/classes:gate-adapters/target/classes:gate-bootstrap/target/classes:gate-web/target/classes:ui-root:$(ls gate-web/target/dependency/*.jar | grep -vE 'junit|archunit|opentest4j|apiguardian' | tr '\n' ':')"
          native-image --no-fallback \
            -H:+ReportExceptionStackTraces \
            -H:ConfigurationFileDirectories=.github/native-image \
            -H:IncludeResources='db/migration/.*' \
            -H:IncludeResources='gate/hooks/.*' \
            -H:IncludeResources='simplelogger\.properties' \
            -H:IncludeResources='static/.*' \
            -cp "$CP" \
            -o ow-linux-x86_64 \
            gate.web.GateWebApp
          # 只去调试信息，保留符号表（产物从 55MB 降到 ~45MB）
          objcopy --strip-debug ow-linux-x86_64

      - name: Native image compile (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          CP="gate-domain/target/classes;gate-ports/target/classes;gate-application/target/classes;gate-adapters/target/classes;gate-bootstrap/target/classes;gate-web/target/classes;ui-root;$(ls gate-web/target/dependency/*.jar | grep -vE 'junit|archunit|opentest4j|apiguardian' | tr '\n' ';')"
          # git-bash 不做 PATHEXT 解析：裸 native-image 解析不到 native-image.cmd，必须带扩展名
          native-image.cmd --no-fallback \
            -H:+ReportExceptionStackTraces \
            -H:ConfigurationFileDirectories=.github/native-image \
            -H:IncludeResources='db/migration/.*' \
            -H:IncludeResources='gate/hooks/.*' \
            -H:IncludeResources='simplelogger\.properties' \
            -H:IncludeResources='static/.*' \
            -cp "$CP" \
            -o ow-windows-x86_64 \
            gate.web.GateWebApp

      # 冒烟：启动到监听 + 登录令牌落盘 + status API + SPA（index 与首个 JS bundle）。
      # SPA 断言不能省：资源嵌入错位时 API 照常、页面全 404（第三轮教训）。
      # WS 断言不能省：native 镜像缺 WebSocket 栈反射元数据时升级握手照常 101、
      # 但应用层帧全哑（终端"永远空白"那次回归，HTTP 冒烟完全测不到）。
      - name: Smoke (boot + token + status API + SPA + WS)
        shell: python
        run: |
          import base64, json, os, socket, struct, subprocess, time, urllib.request

          if os.name == "nt":
              bin_name, exe = "./ow-windows-x86_64.exe", "./ow-windows-x86_64.exe"
          else:
              bin_name, exe = "./ow-linux-x86_64", "./ow-linux-x86_64"
          os.makedirs("smoke-run", exist_ok=True)
          os.chdir("smoke-run")
          with open("boot.log", "w") as log:
              proc = subprocess.Popen([exe], stdout=log, stderr=log)
          token = None
          for _ in range(240):
              try:
                  with open("boot.log", encoding="utf-8", errors="replace") as f:
                      boot = f.read()
                  if "listening on" in boot and "GATE_WEB_TOKEN=" in boot:
                      token = boot.split("GATE_WEB_TOKEN=")[1].split()[0]
                      break
              except FileNotFoundError:
                  pass
              time.sleep(0.25)
          assert token, "BOOT FAILED:\n" + boot
          auth = {"Authorization": f"Bearer {token}"}
          req = urllib.request.Request("http://127.0.0.1:18080/api/status", headers=auth)
          urllib.request.urlopen(req, timeout=10).read()

          # --- WebSocket smoke: first frame auth + error reply + close (no shell spawned) ---
          s = socket.create_connection(("127.0.0.1", 18080), timeout=10)
          key = base64.b64encode(os.urandom(16)).decode()
          s.sendall((
              "GET /ws/terminal HTTP/1.1\r\nHost: 127.0.0.1:18080\r\nUpgrade: websocket\r\n"
              f"Connection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n"
          ).encode())
          head = b""
          while b"\r\n\r\n" not in head:
              head += s.recv(4096)
          assert b"101" in head.split(b"\r\n")[0], "WS upgrade failed: " + head.decode(errors="replace")

          def ws_send_text(sock, text):
              p = text.encode(); m = os.urandom(4)
              mk = bytes(b ^ m[i % 4] for i, b in enumerate(p))
              n = len(p)
              hdr = struct.pack("!BB", 0x81, 0x80 | n) if n < 126 else struct.pack("!BBH", 0x81, 0x80 | 126, n)
              sock.sendall(hdr + m + mk)

          def ws_recv(sock, timeout=15.0):
              sock.settimeout(timeout)
              hdr = b""
              while len(hdr) < 2:
                  c = sock.recv(2 - len(hdr))
                  assert c, "WS EOF while reading header"
                  hdr += c
              ln = hdr[1] & 0x7F
              if ln == 126:
                  ext = b""
                  while len(ext) < 2:
                      ext += sock.recv(2 - len(ext))
                  ln = struct.unpack("!H", ext)[0]
              data = b""
              while len(data) < ln:
                  c = sock.recv(ln - len(data))
                  assert c, "WS EOF while reading payload"
                  data += c
              return hdr[0], data

          # 无效 token 的 start：服务端必须回 error 帧（证明 WS 消息管线在 native 里活着）
          ws_send_text(s, json.dumps({"op": "start", "token": "smoke-invalid", "project": "x", "dir": "/"}))
          deadline = time.time() + 30
          got_error = False
          while time.time() < deadline:
              op, data = ws_recv(s, timeout=deadline - time.time())
              if op == 0x8:
                  break
              if op in (0x1, 0x2):
                  msg = json.loads(data.decode("utf-8", "replace"))
                  if msg.get("op") == "error":
                      got_error = True
                      break
          s.close()
          assert got_error, "native WS message pipeline dead (no error frame for invalid token)"
          print("smoke OK (api + spa-asset-list + ws error frame)")

          # SPA 资源断言（沿用旧检查：index 引用 asset 且可取回）
          req = urllib.request.Request("http://127.0.0.1:18080/", headers=auth)
          index = urllib.request.urlopen(req, timeout=10).read().decode("utf-8", "replace")
          assert '<div id="root">' in index, "SPA INDEX BAD"
          import re
          m = re.search(r'/assets/[^"]+\.js', index)
          assert m, "NO ASSET REF"
          req = urllib.request.Request("http://127.0.0.1:18080" + m.group(0), headers=auth)
          urllib.request.urlopen(req, timeout=10).read()
          proc.terminate() if os.name != "nt" else proc.kill()

      - name: Rename Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: mv ow-windows-x86_64.exe ow-windows-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: ow-native-${{ runner.os }}
          path: ow-linux-x86_64
          retention-days: 14
          if-no-files-found: error
        if: runner.os == 'Linux'

      - uses: actions/upload-artifact@v4
        with:
          name: ow-native-${{ runner.os }}
          path: ow-windows-x86_64
          retention-days: 14
          if-no-files-found: error
        if: runner.os == 'Windows'

      # 打 tag（v*）时把二进制附到 GitHub Release —— 私有仓库的 Release 同样仅协作者可见。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then F=ow-windows-x86_64; else F=ow-linux-x86_64; fi
          gh release upload "${GITHUB_REF_NAME}" "$F" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  desktop:
    name: desktop installer (windows)
    needs: native
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # 侧车 = 本轮 native 产物（含当次 SPA），保证桌面壳与后端同源同版本
      - uses: actions/download-artifact@v4
        with:
          name: ow-native-Windows
          path: sidecar
      - name: Place sidecar binary
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp sidecar/ow-windows-x86_64 desktop/src-tauri/binaries/ow-x86_64-pc-windows-msvc.exe

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install shell deps (tauri-cli)
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # 安装包版本号 = 根 pom <revision>（单一事实来源）。此前安装包后缀长期停在
      # tauri.conf.json 里手写的 0.1.0，与后端版本脱钩；这里构建期动态注入覆盖，
      # 不再信任 conf 里的副本（那份仅作本地 dev 兜底，由 doc/local/tools/version-bump 同步）。
      - name: Read app version from pom revision
        shell: bash
        run: |
          VER=$(grep -o "<revision>[^<]*</revision>" pom.xml | head -1 | sed -e 's/<[^>]*>//g')
          if [ -z "$VER" ]; then
            echo "cannot read <revision> from pom.xml" >&2
            exit 1
          fi
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "installer version: $VER"
      - name: Build installer
        working-directory: desktop
        shell: bash
        run: npx tauri build --config "{\"version\":\"$APP_VERSION\"}"

      - uses: actions/upload-artifact@v4
        with:
          name: ow-desktop-installer-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" desktop/src-tauri/target/release/bundle/nsis/*.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
