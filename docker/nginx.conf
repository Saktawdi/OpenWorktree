# OpenWorktree 容器内 nginx —— 对外的唯一入站口。
# 后端刻意 fail-closed 绑死回环，这里做同容器转发：
#   容器外 → nginx(0.0.0.0:8080) → java(127.0.0.1:18080)
# 配置独立完整（不依赖发行版默认站点），以便镜像以非 root 用户启动；
# 所有运行时文件（pid / 临时目录）落在 /data 下。

# 前台运行（PID 1 语义）：entrypoint 以后台 job 方式拉起 nginx，
# 不关守护进程化的话 master 会自我分离，shell 误判其退出而整体回收。
daemon off;

worker_processes 2;
pid /data/logs/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 工作台轮询接口很频繁，访问日志是纯噪声；后端自己记录 4xx/5xx。
    access_log off;

    client_max_body_size 64m;    # 预提审快照/差异文本可能超过默认 1m
    sendfile on;

    # 全量转发，包括 /ws/terminal（WebSocket）与 /api/**/events（SSE 长连接）
    map $http_upgrade $openworktree_connection {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;

            # 保留客户端原始 Host，AuthFilter 的 allowed_origins 白名单照常生效。
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $openworktree_connection;

            # SSE/WS 长连接：关缓冲、放长超时
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    client_body_temp_path /data/nginx-tmp/client_body;
    proxy_temp_path       /data/nginx-tmp/proxy;
    fastcgi_temp_path     /data/nginx-tmp/fastcgi;
    uwsgi_temp_path       /data/nginx-tmp/uwsgi;
    scgi_temp_path        /data/nginx-tmp/scgi;
}
